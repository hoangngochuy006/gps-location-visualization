<html>

<head>

    <style>
        #myMap {
            width: 100%;
            height: 100%;
        }
    </style>

    <link rel="stylesheet"
          href="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.css"
          type="text/css" />

    <script src="https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.js"></script>

</head>

<body onload="init()">

    <div id="myMap"></div>

    <script type="text/javascript">

        var map;
var features = [];

function init() {

    fetch("https://smartbuildinggpssensor.blob.core.windows.net/gps-data/?restype=container&comp=list")
        .then(response => response.text())
        .then(str => new window.DOMParser().parseFromString(str, "text/xml"))
        .then(xml => {

            let blobList = Array.from(xml.querySelectorAll("Url"));

            let requests = blobList.map(function(blobUrl) {
                return loadJSON(blobUrl.textContent);
            });

            return Promise.all(requests);

        })
        .then(() => {

            console.log("GPS points loaded:", features.length);

            map = new atlas.Map('myMap', {

                center: [106.663, 10.802],
                zoom: 14,

                authOptions: {
                    authType: "subscriptionKey",
                    subscriptionKey: "YOUR_AZURE_MAPS_KEY"
                }

            });

            map.events.add('ready', function () {

                var source = new atlas.source.DataSource();

                map.sources.add(source);

                map.layers.add(
                    new atlas.layer.BubbleLayer(source)
                );

                source.add(features);

            });

        })
        .catch(function(error) {
            console.error("Error loading GPS data:", error);
        });
}


function loadJSON(file) {

    return new Promise(function(resolve, reject) {

        var xhr = new XMLHttpRequest();

        xhr.onreadystatechange = function () {

            if (xhr.readyState === XMLHttpRequest.DONE) {

                if (xhr.status === 200) {

                    try {

                        var gpsData = JSON.parse(xhr.responseText);

                        gpsData.forEach(function(gps) {

                            features.push(
                                new atlas.data.Feature(
                                    new atlas.data.Point([
                                        parseFloat(gps.gps.lon),
                                        parseFloat(gps.gps.lat)
                                    ])
                                )
                            );

                        });

                        resolve();

                    } catch (error) {

                        reject(error);

                    }

                } else {

                    reject(
                        new Error(
                            "Failed to load " + file +
                            " (HTTP " + xhr.status + ")"
                        )
                    );

                }

            }

        };

        xhr.open("GET", file, true);
        xhr.send();

    });
}
    </script>

</body>

</html>
